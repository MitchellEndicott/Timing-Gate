; Sprint timing gate firmware: XIAO ESP32-C3, Arduino framework.
; Build one env per post type:
;   pio run -e emitter -t upload
;   pio run -e receiver -t upload
; Serial monitor: pio device monitor   (115200 baud)

[platformio]
default_envs = receiver

[env]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; USB-C serial on the XIAO ESP32-C3 is native USB CDC
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:emitter]
build_src_filter = -<*> +<emitter.cpp>

[env:receiver]
build_src_filter = -<*> +<receiver.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
