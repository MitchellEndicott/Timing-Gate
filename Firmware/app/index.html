<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timing Gates</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #14181f; --muted: #5d6675; --line: #dde1e8;
    --accent: #1a6cf0; --ok: #1e8a4c; --warn: #b7791f; --bad: #c53030;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #181d26; --text: #eef1f6; --muted: #9aa4b5; --line: #2a3140;
            --accent: #5b9dff; --ok: #4cc17f; --warn: #e0b04a; --bad: #f07575; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 14px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 16px; background: var(--accent);
           color: #fff; font-weight: 600; min-height: 48px; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .45; }
  select { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); min-height: 44px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
          border: 1px solid var(--line); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.warn { color: var(--warn); border-color: var(--warn); }
  .pill.bad { color: var(--bad); border-color: var(--bad); }
  .bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .big { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; margin: 6px 0; }
  #banner { text-align: center; font-weight: 600; }
  ol { margin: 8px 0 0; padding-left: 22px; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: var(--muted); }
  pre { white-space: pre-wrap; font-size: 12px; max-height: 220px; overflow: auto; margin: 8px 0 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="row">
    <h1>Timing gates</h1>
    <select id="mode" aria-label="Mode">
      <option value="two">Two gates</option>
      <option value="phone">Phone start</option>
    </select>
  </div>

  <div id="unsupported" class="card hidden">
    This browser cannot use Bluetooth from a web page. Use Chrome on Android, or Chrome/Edge on a computer.
    iPhone Safari does not support Web Bluetooth.
  </div>

  <div id="gates"></div>

  <div class="card">
    <div id="banner" class="muted">Connect the receiver gate(s) to begin.</div>
    <div class="big" id="result">&ndash;</div>
    <div class="row">
      <button id="arm">Arm</button>
      <button id="start" class="hidden">Start (beep)</button>
      <button id="disarm" class="secondary">Disarm</button>
    </div>
  </div>

  <div class="card">
    <div class="row"><h2>Runs</h2><button id="copy" class="secondary">Copy</button></div>
    <ol id="history"></ol>
  </div>

  <details class="card"><summary>Log</summary><pre id="log"></pre></details>
</main>

<script>
// ===== BEGIN CORE (pure functions; tested in Node against the C++ packets) =====
const SVC = '7a1c0001-6b1e-4c1d-9d3a-5f6e7d8c9b01';
const CMD = '7a1c0002-6b1e-4c1d-9d3a-5f6e7d8c9b01';
const EVT = '7a1c0003-6b1e-4c1d-9d3a-5f6e7d8c9b01';

// Packet layout is documented in include/gate_core.h (namespace proto). Little-endian.
function parseEvent(dv) {
  if (dv.byteLength < 1) return null;
  const type = dv.getUint8(0);
  if (type === 0x01 && dv.byteLength >= 13)
    return { type: 'pong', id: dv.getUint32(1, true), tDev: Number(dv.getBigInt64(5, true)) };
  if (type === 0x02 && dv.byteLength >= 11)
    return { type: 'trigger', seq: dv.getUint16(1, true), tDev: Number(dv.getBigInt64(3, true)) };
  if (type === 0x03 && dv.byteLength >= 7)
    return { type: 'status', state: dv.getUint8(1), armed: dv.getUint8(2) === 1,
             rate: dv.getUint16(3, true), expected: dv.getUint16(5, true) };
  return null;
}
function cmdPacket(ch) { return Uint8Array.of(ch.charCodeAt(0)); }
function pingPacket(id) {
  const b = new Uint8Array(5);
  b[0] = 'P'.charCodeAt(0);
  new DataView(b.buffer).setUint32(1, id, true);
  return b;
}
// samples: [{tSend, tRecv, tDev}] in microseconds. dev = phone + offset.
// Uses the shortest round trip, which leaves the least room for asymmetry.
function estimateOffset(samples) {
  let best = null;
  for (const s of samples) {
    const rtt = s.tRecv - s.tSend;
    if (rtt < 0) continue;
    if (!best || rtt < best.rtt) best = { rtt: rtt, offset: s.tDev - (s.tSend + rtt / 2) };
  }
  return best;
}
const BEAM_STATES = ['searching', 'present', 'locked'];
// ===== END CORE =====

// ---------------------------------------------------------------- app state
const SLOTS = [
  { key: 'start', label: 'Start gate' },
  { key: 'finish', label: 'Finish gate' },
];
const slots = {};
let phase = 'idle';        // idle | armed | done
let phoneT0 = null;        // phone-start mode: start time in phone microseconds
const runs = [];
const $ = (id) => document.getElementById(id);
const nowUs = () => performance.now() * 1000;

function log(msg) {
  const t = (performance.now() / 1000).toFixed(3);
  $('log').textContent += '[' + t + '] ' + msg + '\n';
}

function mode() { return $('mode').value; }
function activeSlots() { return mode() === 'two' ? ['start', 'finish'] : ['finish']; }

// ---------------------------------------------------------------- gate cards
function buildCards() {
  const host = $('gates');
  host.innerHTML = '';
  for (const def of SLOTS) {
    const s = { key: def.key, label: def.label, device: null, cmd: null, connected: false,
                beam: null, armed: false, rate: 0, expected: 0, offset: null, rtt: null,
                pings: {}, samples: [], trigger: null };
    slots[def.key] = s;
    const el = document.createElement('div');
    el.className = 'card';
    el.id = 'card-' + def.key;
    el.innerHTML =
      '<div class="row"><h2>' + def.label + '</h2><span class="pill" id="pill-' + def.key + '">not connected</span></div>' +
      '<div class="bar"><div id="bar-' + def.key + '"></div></div>' +
      '<div class="muted" id="info-' + def.key + '">Beam signal: &ndash;</div>' +
      '<div class="row" style="margin-top:10px"><button id="conn-' + def.key + '">Connect</button></div>';
    host.appendChild(el);
    $('conn-' + def.key).addEventListener('click', () => connect(def.key));
  }
}

function renderSlot(s) {
  const pill = $('pill-' + s.key), bar = $('bar-' + s.key), info = $('info-' + s.key);
  if (!s.connected) {
    pill.textContent = 'not connected'; pill.className = 'pill';
    bar.style.width = '0'; info.textContent = 'Beam signal: –';
    $('conn-' + s.key).textContent = s.device ? 'Reconnect' : 'Connect';
    return;
  }
  $('conn-' + s.key).textContent = 'Reconnect';
  const name = s.beam === null ? 'waiting' : BEAM_STATES[s.beam] || '?';
  pill.textContent = name;
  pill.className = 'pill ' + (s.beam === 1 ? 'ok' : s.beam === 2 ? 'warn' : 'bad');
  const pct = s.expected ? Math.min(100, Math.round((100 * s.rate) / s.expected)) : 0;
  bar.style.width = pct + '%';
  let sync = s.offset === null ? 'not synced' : 'synced, round trip ' + (s.rtt / 1000).toFixed(1) + ' ms';
  info.textContent = 'Beam signal ' + pct + '% (' + s.rate + '/' + s.expected + ' pulses/s) · ' + sync;
}

// ---------------------------------------------------------------- bluetooth
async function connect(key) {
  const s = slots[key];
  try {
    const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    s.device = device;
    device.addEventListener('gattserverdisconnected', () => {
      s.connected = false; s.offset = null; renderSlot(s); log(s.label + ' disconnected'); updateButtons();
    });
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    s.cmd = await svc.getCharacteristic(CMD);
    const evt = await svc.getCharacteristic(EVT);
    await evt.startNotifications();
    evt.addEventListener('characteristicvaluechanged', (e) => onEvent(s, e.target.value));
    s.connected = true; s.beam = null;
    log(s.label + ' connected: ' + (device.name || 'unnamed'));
    renderSlot(s); updateButtons();
    keepAwake();
    await syncSlot(s);
  } catch (err) {
    log(s.label + ' connect failed: ' + err);
    setBanner('Connect failed: ' + err.message, 'bad');
  }
}

async function send(s, bytes) {
  if (s.cmd.writeValueWithoutResponse) await s.cmd.writeValueWithoutResponse(bytes);
  else await s.cmd.writeValue(bytes);
}

function onEvent(s, dv) {
  const e = parseEvent(dv);
  if (!e) return;
  if (e.type === 'pong') {
    const p = s.pings[e.id];
    if (p) { s.samples.push({ tSend: p, tRecv: nowUs(), tDev: e.tDev }); delete s.pings[e.id]; }
  } else if (e.type === 'status') {
    s.beam = e.state; s.rate = e.rate; s.expected = e.expected; s.armed = e.armed;
    renderSlot(s);
  } else if (e.type === 'trigger') {
    onTrigger(s, e);
  }
}

// Ping-pong sync: 15 pings, 40 ms apart, then take the shortest round trip.
async function syncSlot(s, count) {
  count = count || 15;
  s.samples = []; s.pings = {};
  for (let i = 0; i < count; i++) {
    const id = (Math.random() * 0xffffffff) >>> 0;
    s.pings[id] = nowUs();
    await send(s, pingPacket(id));
    await new Promise((r) => setTimeout(r, 40));
  }
  await new Promise((r) => setTimeout(r, 300));  // let the last pongs arrive
  const best = estimateOffset(s.samples);
  if (!best) { log(s.label + ': no pongs received'); return false; }
  s.offset = best.offset; s.rtt = best.rtt;
  log(s.label + ' sync: ' + s.samples.length + '/' + count + ' pongs, best round trip ' +
      (best.rtt / 1000).toFixed(1) + ' ms');
  renderSlot(s);
  return true;
}

// ---------------------------------------------------------------- run logic
function setBanner(text, cls) {
  const b = $('banner');
  b.textContent = text;
  b.className = cls ? '' : 'muted';
  b.style.color = cls ? 'var(--' + cls + ')' : '';
}

function updateButtons() {
  const need = activeSlots();
  const ready = need.every((k) => slots[k].connected);
  $('arm').disabled = !ready || phase === 'armed';
  $('disarm').disabled = phase !== 'armed';
  $('start').classList.toggle('hidden', mode() !== 'phone');
  $('start').disabled = !(phase === 'armed' && phoneT0 === null);
  $('card-start').classList.toggle('hidden', mode() === 'phone');
}

async function arm() {
  const need = activeSlots();
  setBanner('Syncing clocks…');
  $('arm').disabled = true;
  try {
    const ok = await Promise.all(need.map((k) => syncSlot(slots[k])));
    if (!ok.every(Boolean)) { setBanner('Sync failed. Check the log.', 'bad'); updateButtons(); return; }
    for (const k of need) { slots[k].trigger = null; await send(slots[k], cmdPacket('A')); }
    phoneT0 = null; phase = 'armed'; $('result').innerHTML = '&ndash;';
    const notReady = need.filter((k) => slots[k].beam !== 1).map((k) => slots[k].label);
    if (notReady.length) setBanner('Armed, but no steady beam at: ' + notReady.join(', '), 'warn');
    else setBanner(mode() === 'phone' ? 'Armed. Tap Start when ready.' : 'Armed. Run.', 'ok');
    log('armed');
  } catch (err) {
    setBanner('Arm failed: ' + err.message, 'bad'); log('arm failed: ' + err);
  }
  updateButtons();
}

async function disarm() {
  for (const k of activeSlots()) { try { await send(slots[k], cmdPacket('D')); } catch (e) { /* ignore */ } }
  phase = 'idle'; phoneT0 = null;
  setBanner('Disarmed.'); updateButtons(); log('disarmed');
}

let audioCtx = null;
function startTone() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.frequency.value = 1000; gain.gain.value = 0.5;
  osc.connect(gain); gain.connect(audioCtx.destination);
  const latencyUs = ((audioCtx.outputLatency || audioCtx.baseLatency || 0) * 1e6);
  osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  phoneT0 = nowUs() + latencyUs;
  log('phone start, assumed audio latency ' + (latencyUs / 1000).toFixed(0) + ' ms');
  setBanner('Running…', 'ok'); updateButtons();
}

function onTrigger(s, e) {
  if (phase !== 'armed') { log(s.label + ' trigger ignored (not armed)'); return; }
  if (s.offset === null) { log(s.label + ' trigger with no sync'); return; }
  s.trigger = e.tDev - s.offset;  // phone clock, microseconds
  log(s.label + ' trigger #' + e.seq + ' at device ' + e.tDev + ' us');
  let t0 = null;
  if (mode() === 'two') {
    if (s.key === 'start') { setBanner('Started. Waiting for finish…', 'ok'); }
    if (slots.start.trigger !== null) t0 = slots.start.trigger;
  } else if (phoneT0 !== null) {
    t0 = phoneT0;
  }
  const finish = slots.finish.trigger;
  if (t0 !== null && finish !== null) {
    const secs = (finish - t0) / 1e6;
    $('result').textContent = secs.toFixed(3) + ' s';
    runs.push(secs);
    phase = 'done';
    setBanner(secs < 0 ? 'Negative time: finish fired before start. Check gate order.' : 'Done. Arm for the next run.',
              secs < 0 ? 'warn' : 'ok');
    renderRuns(); updateButtons();
  }
}

function renderRuns() {
  const ol = $('history');
  ol.innerHTML = '';
  runs.forEach((r) => { const li = document.createElement('li'); li.textContent = r.toFixed(3) + ' s'; ol.appendChild(li); });
}

async function keepAwake() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) { /* optional */ }
}

// ---------------------------------------------------------------- wiring
if (!navigator.bluetooth) $('unsupported').classList.remove('hidden');
buildCards();
$('arm').addEventListener('click', arm);
$('disarm').addEventListener('click', disarm);
$('start').addEventListener('click', startTone);
$('mode').addEventListener('change', () => { phase = 'idle'; phoneT0 = null; updateButtons(); });
$('copy').addEventListener('click', () => {
  const text = runs.map((r, i) => (i + 1) + ',' + r.toFixed(3)).join('\n');
  if (navigator.clipboard) navigator.clipboard.writeText(text);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
updateButtons();
</script>
</body>
</html>
